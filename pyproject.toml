[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanka-agent"
version = "0.1.0"
description = "SankaAgent core: deterministic router, commands, policy, and formatter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27,<1",
    "google-auth>=2.30,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["sanka*", "core*", "gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
