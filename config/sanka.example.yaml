# SankaAgent configuration (non-secret only).
# Copy to config/sanka.yaml. Never put API keys or tokens in this file.

llm:
  provider: opencode-go            # verified in plan-2
  model: deepseek-v4.1-flash
  base_url: "https://opencode.ai/inference/go/openai/v1"
  api_key_env: OPENCODE_GO_API_KEY # secret lives in env / config/secrets.env
  timeout_seconds: 120
  max_turns: 40

access:
  # Phone numbers in international format, e.g. "62812..."
  owner_numbers: []
  committee_numbers: []
  # WhatsApp group JIDs, e.g. "120363001234567890@g.us"
  allowed_group_ids: []
  # Bot JIDs/numbers used to match mentions from the bridge.
  bot_ids: []

workspace:
  # Path or env name for the service-account JSON. Keep the file outside the repo.
  service_account_env: GOOGLE_SERVICE_ACCOUNT_JSON
  # Google OAuth scopes. Plan-5 only calls values.get; write access arrives in plan-6.
  scopes:
    - "https://www.googleapis.com/auth/spreadsheets"
  # Alias allowlist: tools never accept a raw spreadsheet id.
  read_allowlist: []
  # Example entry (copy it into the list, not as a string):
  # - alias: kehadiran
  #   spreadsheet_id: "<spreadsheet id, 20-100 chars>"
  write_allowlist: []              # plan-6 changes this shape

tools:
  shell_enabled: false             # owner only; this toggle is the second gate
  browser_enabled: false
  browser_profile_dir: ""          # dedicated Chrome profile, never the owner's
  max_calls_per_turn: 6
  recap:
    max_groups: 20
  web_search:
    provider: searxng              # only searxng is supported
    base_url: "http://127.0.0.1:8080"  # loopback may use http; other hosts need https
    api_key_env: ""                # optional, for a reverse proxy
    max_results: 5
    timeout_seconds: 10
    max_chars: 4000
  docs:
    dir: ""                        # absolute path outside the repo
    max_bytes: 5000000
    max_chars: 50000
  sheets:
    timeout_seconds: 20
    max_cells: 20000
    max_chars: 8000

limits:
  max_reply_chars: 3500
  rate_limit_per_minute: 6
  rate_limit_per_day: 200
  outbound_per_minute: 20
  session_idle_ttl_minutes: 60
  inbound_dedup_ttl_minutes: 15

# Deterministic recaps computed by code, keyed by recap name.
# aliases must exist in workspace.read_allowlist. Example (after filling the allowlist):
# recaps:
#   kehadiran:
#     title: "Rekap Kehadiran"
#     alias: kehadiran
#     range: "Kehadiran!A1:F1000"
#     header_row: 1
#     filters:
#       - column: "Status"
#         equals: "Hadir"
#     group_by: ["Divisi"]
#     metrics:
#       - op: count
#       - op: sum
#         column: "Nominal"
recaps: {}

group_context:
  enabled: false
  dir: "~/.local/share/sanka/group-context"
  capture_all_groups: false
  capture_group_ids: []
  retention_hours: 24
  max_messages: 200
  inject_messages: 30
  inject_max_chars: 3500

attachments:
  dir: ""                # absolute path outside the repo; "" disables
  max_bytes: 25000000
  max_per_message: 4
  max_image_bytes: 8000000
  retention_minutes: 1440
  max_total_bytes: 536870912

gateway:
  bridge_url: "http://127.0.0.1:3000"
  require_mention: true
  dm_policy: open                  # open | pairing
  group_policy: allowlist          # allowlist | open
  send_read_receipts: false
  # Python gateway HTTP surface; loopback only, token from env (ADR-0018).
  listen_host: 127.0.0.1           # must be 127.0.0.1, ::1, or localhost
  listen_port: 8099
  auth_token_env: SANKA_GATEWAY_TOKEN
  request_timeout_seconds: 10
  max_inbound_age_seconds: 300     # 0 disables the staleness check
