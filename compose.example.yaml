# Contoh deployment: Postgres+pgvector sebagai satu database jiwa, bot sebagai primary.
# Salin menjadi compose.yaml lalu isi password; jangan commit kredensial.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sanka
      POSTGRES_USER: sanka
      POSTGRES_PASSWORD: CHANGE_ME
    volumes:
      - sanka-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanka -d sanka"]
      interval: 5s
      timeout: 5s
      retries: 20

  sanka:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      SANKA_DATABASE_URL: postgresql+psycopg://sanka:CHANGE_ME@postgres:5432/sanka
      GOOGLE_SERVICE_ACCOUNT_PATH: /run/secrets/google-sa.json
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./roles.yaml:/app/roles.yaml
      - ./SOUL.md:/app/SOUL.md
      - ./.sanka:/app/.sanka
      - ./secrets/google-sa.json:/run/secrets/google-sa.json:ro
      - /var/run/docker.sock:/var/run/docker.sock

  sandbox-proxy:
    image: ubuntu/squid:latest
    restart: unless-stopped
    volumes:
      - ./deploy/sandbox-proxy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - sanka-sandbox
      - dokploy-network

volumes:
  sanka-pg:

networks:
  sanka-sandbox:
    name: sanka-sandbox
    internal: true
  dokploy-network:
    external: true
