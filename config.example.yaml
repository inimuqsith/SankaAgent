persona: |
  Kamu Sanka, asisten pribadi di WhatsApp. Jawab singkat, santai, bahasa Indonesia.

llm:
  base_url: "https://opencode.ai/inference/go/openai/v1"
  model: deepseek-v4.1-flash
  api_key_env: OPENCODE_GO_API_KEY
  max_turns: 20
  timeout_seconds: 120

# Path relatif di-resolve dari folder config.yaml, jadi data tetap di dalam project.
workspace: ".sanka/workspace"

whatsapp:
  session_db: ".sanka/whatsapp.db"
  history_db: ".sanka/history.db"
  require_mention: true
  bot_name: sanka

roles:
  # tools/commands yang tidak ditulis -> pakai default dari registry handler.
  # Kalau ditulis, isi YAML ini yang menang (pola glob: "*", "mcp__*").
  # `tools: []` atau `commands: []` berarti role itu tidak boleh memakai apa pun.
  owner:
    users: ["6280000000000"]      # isi nomor owner, international format tanpa +
    tools: ["*"]
    commands: ["*"]
  member:
    tools: ["read", "web_search", "chat_history", "memory", "skill", "send", "mcp__*"]
    commands: ["help", "ping", "reset", "memori", "skill", "kirim"]
    # user/panitia: memori chat + global (scope pada tool memory), baca skill, kirim file.
    # Hapus memori dan simpan skill tetap owner-only. Batasi `users:` bila bot
    # menerima DM publik.
default_role: member

sandbox:
  runtime: podman
  image: "docker.io/library/python:3.12-slim"
  timeout_seconds: 120

web_search:
  base_url: ""          # instance SearXNG, mis. "http://127.0.0.1:8080"; kosong = hanya ddgs
  timeout_seconds: 10

memory:
  # fakta/preferensi lintas sesi; DB dibuat 0600, di luar workspace
  path: ".sanka/memory.db"
  max_items: 20          # per scope (global/chat) yang diinjeksi
  max_chars: 3000        # batas total blok memori di system prompt
  auto_extract: true     # AI mengekstrak memori tahan lama setelah tiap turn

skills:
  # prosedur lokal: <dir>/<nama>/SKILL.md (frontmatter: name, description)
  dir: ".sanka/skills"
  max_index_chars: 3000  # hanya nama + deskripsi yang masuk prompt

mcp:
  servers: {}
  # contoh:
  # time:
  #   command: uvx
  #   args: ["mcp-server-time"]
  #   env: {}
